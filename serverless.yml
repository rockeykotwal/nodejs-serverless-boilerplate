service: nodejs-serverless-boilerplate

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    STAGE: ${self:provider.stage}
    NODE_ENV: ${self:provider.stage}

plugins:
  - serverless-offline

functions:
  health:
    handler: src/handlers/health.handler
    events:
      - http:
          path: /health
          method: GET
          cors: true

  hello:
    handler: src/handlers/hello.handler
    events:
      - http:
          path: /hello
          method: GET
          cors: true
      - http:
          path: /hello/{name}
          method: GET
          cors: true

custom:
  serverless-offline:
    httpPort: 3000
    lambdaPort: 3002
